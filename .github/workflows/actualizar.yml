name: Actualizar marcadores y parley

on:
  schedule:
    - cron: "41 * * * *"   # cada hora (GitHub a veces las retrasa)
    - cron: "45,55 11 * * *"   # 5:45 y 5:55 a.m. CDMX: fijar el parley del día
    - cron: "5,15,25 12 * * *" # respaldo si GitHub retrasa las anteriores
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar marcadores y momios de ESPN
        run: python3 tools/update.py fresh 1 2
      - name: Fijar parley y conservar momios
        run: node tools/finalize.js fresh/days data/days out/days
      - name: Guardar datos y armar la página
        run: |
          cp out/days/*.json data/days/
          python3 tools/props.py data/days || echo "props no disponibles en esta corrida"
          STANDALONE=1 node tools/build.js tools/page.html tools/model.js index.html data/days
      - name: Subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/days
          git diff --cached --quiet || (git commit -m "Actualizar datos" && git push)
